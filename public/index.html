<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Job - GG Pumped Floorscreeds</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="booking-page">

<h1>Book a Job</h1>
<p class="subtitle">Fill in the details below and we'll get back to you to confirm.</p>

<form id="bookingForm">
  <label for="name">Name</label>
  <input type="text" id="name" required>

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" required>

  <label for="jobType">Job Type</label>
  <select id="jobType" required>
    <option value="">Select...</option>
    <option value="Concrete Pumping">Concrete Pumping</option>
    <option value="Floor Screed">Floor Screed</option>
    <option value="Other">Other</option>
  </select>

  <label for="address">Eir Code</label>
  <input type="text" id="address" required>

  <label for="size">Approximate Size (Cube mtrs)</label>
  <input type="number" id="size" min="0">

  <label for="preferredDate">Preferred Date</label>
  <input type="date" id="preferredDate" required>

  <label for="notes">Notes (optional)</label>
  <textarea id="notes" rows="3"></textarea>

  <button type="submit">Submit Request</button>
</form>

<p id="message"></p>

<script>
document.getElementById('bookingForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    jobType: document.getElementById('jobType').value,
    address: document.getElementById('address').value,
    size: document.getElementById('size').value,
    preferredDate: document.getElementById('preferredDate').value,
    notes: document.getElementById('notes').value
  };

  const messageEl = document.getElementById('message');
  messageEl.style.color = '#222';
  messageEl.textContent = 'Submitting...';

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('Something went wrong.');

    messageEl.style.color = 'green';
    messageEl.textContent = 'Thanks! Your request has been sent.';
    document.getElementById('bookingForm').reset();
  } catch (err) {
    messageEl.style.color = 'red';
    messageEl.textContent = 'Sorry, something went wrong. Please call instead.';
  }
});
</script>

</body>
</html>
