<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Job - GG Pumped Floorscreeds</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="booking-page">

<div class="site-header">
  <img src="logo.png" alt="GG Pumped Floorscreed" class="site-logo">
</div>

<h1>Book a Job</h1>
<p class="subtitle">Fill in the details below and we'll get back to you to confirm.</p>

<form id="bookingForm">
  <label for="name">Name</label>
  <input type="text" id="name" required>

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" required>

  <label for="jobType">Job Type</label>
  <select id="jobType" required>
    <option value="">Select...</option>
    <option value="Concrete Pumping">Concrete Pumping</option>
    <option value="Floor Screed">Floor Screed</option>
    <option value="Other">Other</option>
  </select>

  <label for="address">Eir Code</label>
  <input type="text" id="address" required>

  <label for="size">Approximate Amount (Cube mtrs)</label>
  <input type="number" id="size" min="0">

  <label for="preferredDate">Preferred Date</label>
  <input type="date" id="preferredDate" required>

  <label for="notes">Notes (optional)</label>
  <textarea id="notes" rows="3"></textarea>

  <button type="submit">Submit Request</button>
</form>

<p id="message"></p>

<div id="popupOverlay" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <div id="popupIcon" class="popup-icon"></div>
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>
document.getElementById('bookingForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    jobType: document.getElementById('jobType').value,
    address: document.getElementById('address').value,
    size: document.getElementById('size').value,
    preferredDate: document.getElementById('preferredDate').value,
    notes: document.getElementById('notes').value
  };

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('Something went wrong.');

    showPopup(true, 'Request Sent', "Thanks! We've received your booking and will be in touch to confirm.");
    document.getElementById('bookingForm').reset();
  } catch (err) {
    showPopup(false, 'Something Went Wrong', 'Please try again, or call us directly.');
  }
});

function showPopup(success, title, text) {
  document.getElementById('popupIcon').textContent = success ? '✓' : '✕';
  document.getElementById('popupIcon').className = 'popup-icon ' + (success ? 'popup-success' : 'popup-error');
  document.getElementById('popupTitle').textContent = title;
  document.getElementById('popupText').textContent = text;
  document.getElementById('popupOverlay').style.display = 'flex';
}

function closePopup() {
  document.getElementById('popupOverlay').style.display = 'none';
}
</script>

</body>
</html>
